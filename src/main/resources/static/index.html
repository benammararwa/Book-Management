<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=book_ribbon,search,filter_alt,edit_line,delete"
          rel="stylesheet">
    <script src="script.js" defer></script>
    <title>My Library</title>
</head>
<body class="flex flex-row">
    <aside class="h-screen w-80 bg-red-50 flex flex-col p-8 bg-[url(../images/sidebar-img.png)] bg-cover">
        <div class="sidebar-logo flex gap-3 mb-8 items-center">
            <span class="material-symbols-outlined h-6 w-6 text-ivory font-bold ">book_ribbon</span>
            <div class="app-name font-bold text-2xl text-ivory">My Library</div>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="block font-medium text-white bg-gold/35 p-1 pl-4 rounded-md">My Library</a></li>
            </ul>
        </nav>
    </aside>

    <main class="flex flex-col items-center p-8 h-screen flex-1">
        <header class="flex flex-row w-full justify-between items-center min-h-12 p-6 pt-0">
            <div class="search-and-filter flex flex-row w-auto items-center justify-center gap-4">
                <search>
                    <form action="/search" method="get" class="flex items-center">
                        <input type="search" id="search-input" placeholder="Search for a Book..." class="h-9 p-1 border border-gold rounded-s-sm">
                        <button type="submit" class="search-btn">
                            <span class="material-symbols-outlined bg-gold p-1 h-9 text-white rounded-e-sm border border-gold">search</span>
                        </button>
                    </form>
                </search>

                <button class="filter-btn">
                    <span class="material-symbols-outlined bg-gold h-9 p-1 text-white rounded-sm">filter_alt</span>
                </button>
            </div>

            <button class="add-book-btn bg-gold h-9 p-1 px-2 text-white rounded-sm" type="submit">Add a book</button>
        </header>

        <div class="w-full p-6">
            <table class="w-full">
                <caption class="self-center mb-3">Library's Books</caption>
                <thead class="text-left">
                <tr>
                    <th><input type="checkbox" id="select-all-books"></th>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Author</th>
                    <th>Year</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td><input type="checkbox" class="select-book"></td>
                    <td>1</td>
                    <td>Le petit prince</td>
                    <td>Antoine de Saint-Exupéry</td>
                    <td>1943</td>
                    <td>
                        <button class="edit-book-btn">
                            <span class="material-symbols-outlined">edit_line</span>
                        </button>
                        <button class="del-book-btn">
                            <span class="material-symbols-outlined">delete</span>
                        </button>
                    </td>
                </tr>
                <tr>
                    <td><input type="checkbox" class="select-book"></td>
                    <td>2</td>
                    <td>Les misérables</td>
                    <td>Victor Hugo</td>
                    <td>1862</td>
                    <td>
                        <button class="edit-book-btn">
                            <span class="material-symbols-outlined">edit_line</span>
                        </button>
                        <button class="del-book-btn">
                            <span class="material-symbols-outlined">delete</span>
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>




        <div class="add-book-form hidden">
            <form method="post">
                <h2>Add a book</h2>

                <label for="name">Book's name:</label>
                <input id="name" name="name" type="text">

                <label for="author">Author's name</label>
                <input type="text" name="author" id="author">

                <label for="year">Publish year:</label>
                <input type="number" name="year" id="year">

                <button class="validate" type="submit">Validate</button>

            </form>
        </div>
    </main>
</body>
</html>
